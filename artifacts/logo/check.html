<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>icon check</title>
<style>
:root{--bg:#fbf7ef;--fg:#23201c;--muted:#5e594f;--blue:#2a4d9b;
--serif:"Instrument Serif","Songti SC",Georgia,serif;--body:"Schibsted Grotesk",ui-sans-serif,-apple-system,"PingFang SC",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
body{margin:0;padding:36px 44px;background:var(--bg);color:var(--fg);font:14px/1.6 var(--body);background-image:radial-gradient(#a99c7918 .65px,transparent .65px);background-size:7px 7px}
h1{font:600 24px/1.3 var(--serif);margin:0 0 24px}
.panel{background:#fff;border:2px solid var(--fg);border-radius:9px 13px 8px 11px;box-shadow:3px 3px 0 rgba(35,32,28,.75);padding:18px 22px;margin-bottom:20px}
.label{font:10px var(--mono);letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.row{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
figure{margin:0;text-align:center}figcaption{font:9px var(--mono);color:var(--muted);margin-top:6px}
.pixel{image-rendering:pixelated}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:650;letter-spacing:2px;text-decoration:none;color:inherit}
.brand svg{width:36px;height:36px;display:block}
.brand .en{font:10px var(--mono);letter-spacing:1.3px;color:var(--muted);margin-left:9px;font-weight:400}
.header-note{font-size:12px;letter-spacing:1px;color:var(--muted)}
.site-header{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #23201c30}
.dark{background:#23201c;border-radius:8px;padding:14px 18px;display:flex;gap:26px;align-items:center}
</style></head>
<body>
<h1>山野有数 · C 方向图标检查</h1>

<div class="panel">
  <div class="label">favicon.svg 实际尺寸</div>
  <div class="row">
    <figure><img src="../../web/favicon.svg" width="16" height="16"><figcaption>16</figcaption></figure>
    <figure><img src="../../web/favicon.svg" width="32" height="32"><figcaption>32</figcaption></figure>
    <figure><img src="../../web/favicon.svg" width="48" height="48"><figcaption>48</figcaption></figure>
    <figure><img src="../../web/favicon.svg" width="64" height="64"><figcaption>64</figcaption></figure>
    <figure><img src="../../web/favicon-180.png" width="180" height="180" style="border:1px solid #23201c22"><figcaption>180 png</figcaption></figure>
  </div>
</div>

<div class="panel">
  <div class="label">16px / 32px 放大 10 倍（像素级检查）</div>
  <div class="row">
    <figure><img class="pixel" src="../../web/favicon-16.png" width="160" height="160"><figcaption>16 → 160</figcaption></figure>
    <figure><img class="pixel" src="../../web/favicon-32.png" width="320" height="320"><figcaption>32 → 320</figcaption></figure>
    <figure><img class="pixel" src="../../web/favicon.svg" width="160" height="160"><figcaption>svg 16</figcaption></figure>
  </div>
</div>

<div class="panel">
  <div class="label">页头 36px · 主标（含路线虚线）</div>
  <div class="site-header">
    <span class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9.5 45.6C20.5 41.6 43.5 41.9 54.5 43.7" stroke="#e0b23c" stroke-width="7" opacity=".55" stroke-linecap="round" fill="none"/><path d="M11 47L23 25L31 38L39 17L53 47" stroke="#23201c" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M13 44C19 41 22 34 27 31C33 27 35 23 39 18" stroke="#2a4d9b" stroke-width="2.5" stroke-dasharray="3.6 4.4" stroke-linecap="round" fill="none"/><circle cx="39" cy="17.2" r="3.5" fill="#e0533c"/></svg> 山野有数 <span class="en">TRAIL NOTES</span></span>
    <span class="header-note">一条路线，一份山野计划。</span>
  </div>
</div>

<div class="panel">
  <div class="label">深色底 / apple-touch-icon 圆角裁切</div>
  <div class="row">
    <div class="dark"><img src="../../web/favicon.svg" width="40" height="40"><img src="../../web/logo.svg" width="64" height="64"></div>
    <img src="../../web/apple-touch-icon.png" width="120" height="120" style="border-radius:27px">
    <img src="../../web/logo-512.png" width="120" height="120">
  </div>
</div>
</body></html>
